<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ADMIN HI STORE</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/app.js"></script>

</head>

<body>

<header class="header">

<div class="logo">

<img src="assets/logo.png">

<h1>🎮 ADMIN HI STORE</h1>

<p>Shop sản phẩm kỹ thuật số</p>

</div>

</header>

<section class="account-box">

<div class="avatar">

<img src="assets/avatar.png">

</div>

<div class="info">

<h2 id="username">Khách</h2>

<span>Chưa đăng nhập</span>

</div>

<div class="balance">

<span id="money">0đ</span>

</div>

</section>

<section class="category">

<h2>☰ DANH MỤC</h2>

<div class="grid">

<div class="item active" data-id="aim">
🎯
<p>Aim Lock</p>
</div>

<div class="item" data-id="proxyadr">
🔑
<p>Proxy ADR</p>
</div>

<div class="item" data-id="proxyios">
📱
<p>Proxy IOS</p>
</div>

<div class="item" data-id="menuadr">
🎯
<p>Menu ADR</p>
</div>

<div class="item" data-id="menuios">
📱
<p>Menu IOS</p>
</div>

<div class="item" data-id="dv">
👁️
<p>ĐV + Xuyên Keo</p>
</div>

<div class="item" data-id="ac">
🎮
<p>AC CLON</p>
</div>

</div>

</section>

<section class="products">

<h2>🛍️ SẢN PHẨM</h2>

<div id="product-list">

</div>

</section>

<nav class="bottom">

<button id="home">
🔑
<span>Mua Key</span>
</button>

<button id="history">
📜
<span>Lịch sử</span>
</button>

<button id="deposit">
💳
<span>Nạp tiền</span>
</button>

<button id="profile">
👤
<span>Cá nhân</span>
</button>

</nav>

<div class="chat-button">

💬

</div>

</body>
</html>
