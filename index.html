<!DOCTYPE html>
<html lang="vi">
<head>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#080808;
color:white;
}

header{
background:linear-gradient(90deg,#00ff66,#00aa44);
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

nav{
display:flex;
justify-content:space-around;
padding:15px;

color:#000;

}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:20px;
}

.card{
background:#111;
border:2px solid #00ff66;
border-radius:12px;
padding:20px;
text-align:center;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

.card h2{
color:#00ff66;
margin-bottom:10px;
}

.price{
margin:8px 0;
}

.zalo{

right:15px;
bottom:15px;
background:#00ff66;

padding:15px;

</head>
