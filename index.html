<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>ADMIN HI STORE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050b12;
      color: #fff;
      min-height: 100vh;
      padding-bottom: 85px;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #0b111a;
      border-bottom: 1px solid #18e0d5;
    }

    header h1 {
      color: #18e0d5;
      font-size: 24px;
    }

    header p {
      color: #7e8b98;
      margin-top: 5px;
    }

    .userbar {
      margin: 15px;
      padding: 14px;
      border-radius: 20px;
      background: linear-gradient(135deg, #073941, #101923);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #18e0d5;
      background: #111b26;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .userinfo {
      flex: 1;
    }

    .userinfo small {
      display: block;
      color: #788797;
      margin-top: 4px;
    }

    .balance {
      color: #18e0d5;
      font-weight: bold;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 15px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .card {
      background: linear-gradient(145deg, #0d1823, #10151f);
      border: 1px solid #1b2b39;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .title span {
      color: #18e0d5;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .category {
      background: #121c28;
      border: 1px solid #243342;
      border-radius: 16px;
      padding: 15px 5px;
      text-align: center;
      color: white;
      cursor: pointer;
    }

    .category.active {
      border-color: #18e0d5;
      box-shadow: 0 0 12px #18e0d533;
    }

    .category div {
      font-size: 27px;
      margin-bottom: 7px;
    }

    .products {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .product {
      background: #111a25;
      border: 1px solid #23313f;
      border-radius: 18px;
      padding: 15px;
    }

    .product .icon {
      font-size: 35px;
    }

    .product h3 {
      font-size: 15px;
      margin: 9px 0;
    }

    .product p {
      font-size: 12px;
      color: #7e8b98;
    }

    .price {
      color: #18e0d5;
      font-weight: bold;
      font-size: 17px;
      margin: 12px 0;
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 11px;
      padding: 12px;
      font-weight: bold;
    }

    .buy,
    .mainbtn {
      width: 100%;
      background: #18ddd1;
      color: #00100f;
    }

    .darkbtn {
      width: 100%;
      background: #182431;
      color: #fff;
      margin-top: 9px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 6px 0;
      background: #070d14;
      color: white;
      border: 1px solid #293846;
      border-radius: 11px;
      outline: none;
    }

    input:focus {
      border-color: #18e0d5;
    }

    .notice {
      background: #102129;
      border-left: 3px solid #18e0d5;
      padding: 13px;
      border-radius: 9px;
      color: #aab5c0;
      margin-bottom: 13px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .stat {
      background: #141e29;
      border-radius: 14px;
      padding: 13px 4px;
      text-align: center;
    }

    .stat b {
      display: block;
      color: #18e0d5;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .stat small {
      color: #788797;
    }

    .history {
      background: #111c27;
      border-left: 3px solid #18e0d5;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
    }

    .history small {
      display: block;
      color: #718090;
      margin-top: 4px;
    }

    .qrbox {
      background: #fff;
      border-radius: 16px;
      padding: 10px;
      text-align: center;
      margin-top: 12px;
    }

    .qrbox img {
      width: 100%;
      max-width: 330px;
      display: block;
      margin: auto;
      border-radius: 10px;
    }

    .codebox {
      background: #111c27;
      border: 1px solid #263b4a;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }

    .transfer-code {
      color: #ffd166;
      font-size: 18px;
      font-weight: bold;
      word-break: break-all;
      margin-top: 7px;
    }

    .zalo {
      position: fixed;
      right: 18px;
      bottom: 92px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #08a9e8;
      color: white;
      font-size: 25px;
      z-index: 50;
      box-shadow: 0 4px 20px #0008;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 75px;
      background: #0b1520f5;
      border-top: 1px solid #1d303d;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 40;
    }

    .bottom button {
      background: transparent;
      color: #718091;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .bottom button span {
      font-size: 22px;
      display: block;
    }

    .bottom button.active {
      color: #18e0d5;
    }

    .adminbtn {
      display: none !important;
      background: #291b0c !important;
      color: #ffd166 !important;
    }

    .admin-item {
      background: #111c27;
      border: 1px solid #263b4a;
      border-radius: 13px;
      padding: 13px;
      margin-top: 10px;
    }

    .admin-item button {
      width: 49%;
      margin-top: 10px;
    }

    .approve {
      background: #18ddd1;
    }

    .reject {
      background: #45202a;
      color: #fff;
    }

    @media(max-width:500px) {
      .products {
        grid-template-columns: 1fr 1fr;
      }
      .categories {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 ADMIN HI STORE</h1>
    <p>Shop sản phẩm kỹ thuật số</p>
  </header>

  <div class="userbar">
    <div class="avatar">🎮</div>
    <div class="userinfo"><b id="userName">Khách</b><small id="userStatus">Chưa đăng nhập</small></div>
    <div class="balance" id="balance">0đ</div>
  </div>

  <div class="container">

    <!-- HOME -->
    <section id="home" class="page active">
      <div class="card">
        <div class="title">☷ <span>DANH MỤC</span></div>
        <div class="categories" id="categoryContainer"></div>
      </div>
      <div class="card">
        <div class="title">🛍️ <span>SẢN PHẨM</span></div>
        <div id="products" class="products"></div>
      </div>
    </section>

    <!-- PROFILE -->
    <section id="profile" class="page">
      <div class="card">
        <div class="title">👤 <span>TÀI KHOẢN</span></div>
        <div id="loggedOut">
          <div class="notice">Bạn chưa đăng nhập.</div>
          <button class="mainbtn" onclick="showPage('login')">🔐 ĐĂNG NHẬP</button>
          <button class="darkbtn" onclick="showPage('register')">📝 ĐĂNG KÝ</button>
        </div>
        <div id="loggedIn" style="display:none">
          <div class="stats">
            <div class="stat"><b id="profileBalance">0đ</b><small>SỐ DƯ</small></div>
            <div class="stat"><b id="profileDeposit">0đ</b><small>TỔNG NẠP</small></div>
            <div class="stat"><b id="profileSpent">0đ</b><small>TỔNG CHI</small></div>
          </div>
          <br>
          <button class="darkbtn" onclick="logout()">🚪 ĐĂNG XUẤT</button>
        </div>
      </div>
      <div class="card">
        <div class="title">🎟️ <span>VOUCHER</span></div>
        <input id="voucherCode" placeholder="Nhập mã voucher">
        <button class="mainbtn" onclick="applyVoucher()">ÁP DỤNG VOUCHER</button>
      </div>
    </section>

    <!-- DEPOSIT -->
    <section id="deposit" class="page">
      <div class="card">
        <div class="title">💳 <span>NẠP TIỀN</span></div>
        <div class="notice">Nhập số tiền → hệ thống hiện QR và mã chuyển khoản riêng → chuyển khoản → bấm xác nhận.</div>
        <input id="depositAmount" type="number" min="1000" placeholder="Số tiền muốn nạp">
        <button class="mainbtn" onclick="showDepositQR()">💰 TẠO YÊU CẦU NẠP</button>
        <div id="depositPayment" style="display:none">
