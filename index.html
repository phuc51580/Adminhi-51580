<script>
    // ======= DỮ LIỆU SẢN PHẨM =======
    const products = [
        { id: 1, name: 'AC CLON LV5', cat: 'ac', price: 4000 },
        { id: 2, name: 'ĐV + Nhìn xuyên keo IOS', cat: 'dv', price: 30000 },
        { id: 3, name: 'Menu IOS 1 giờ', cat: 'menu-ios', price: 10000 },
        { id: 4, name: 'Menu IOS 7 ngày', cat: 'menu-ios', price: 150000 },
        { id: 5, name: 'Menu IOS 30 ngày', cat: 'menu-ios', price: 300000 },
        { id: 6, name: 'Menu ADR 7 ngày', cat: 'menu-adr', price: 150000 },
        { id: 7, name: 'Menu ADR 30 ngày', cat: 'menu-adr', price: 300000 },
        { id: 8, name: 'Key Proxy ADR 1 ngày', cat: 'proxy-adr', price: 25000 },
        { id: 9, name: 'Key Proxy ADR 7 ngày', cat: 'proxy-adr', price: 80000 },
        { id: 10, name: 'Key Proxy ADR 30 ngày', cat: 'proxy-adr', price: 250000 },
        { id: 11, name: 'Key Proxy IOS 1 ngày', cat: 'proxy-ios', price: 25000 },
        { id: 12, name: 'Key Proxy IOS 7 ngày', cat: 'proxy-ios', price: 80000 },
        { id: 13, name: 'Key Proxy IOS 30 ngày', cat: 'proxy-ios', price: 250000 },
        { id: 14, name: 'Key Proxy IOS 60 ngày', cat: 'proxy-ios', price: 450000 },
        { id: 15, name: 'Aim Lock V1', cat: 'aim', price: 50000 },
        { id: 16, name: 'Aim Lock V2', cat: 'aim', price: 100000 },
        { id: 17, name: 'Aim Lock V3', cat: 'aim', price: 200000 },
    ];

    // ======= TÀI KHOẢN =======
    const ADMIN_ACCOUNT = {
        username: 'Admin',
        password: 'Phc51580',
        role: 'admin',
        balance: 0,
        voucherUsed: false
    };

    let users = JSON.parse(localStorage.getItem('users')) || [];
    if (!users.find(u => u.username === ADMIN_ACCOUNT.username)) {
        users.push(ADMIN_ACCOUNT);
        localStorage.setItem('users', JSON.stringify(users));
    }

    // ======= STATE =======
    let currentUser = null;
    let history = [];
    let pendingOrders = [];
    let pendingNap = [];
    let orderCounter = 1;
    let napCounter = 1;
    let currentCategory = 'aim';
    let discountPercent = 20;
    let voucherCode = 'Admin_hi_51580';
    let voucherApplied = false;
    let currentNapCode = '';

    // ======= DOM =======
    const productList = document.getElementById('productList');
    const categoryFilter = document.getElementById('categoryFilter');
    const userName = document.getElementById('userName');
    const userBalance = document.getElementById('userBalance');
    const pName = document.getElementById('pName');
    const pBalance = document.getElementById('pBalance');
    const pStatus = document.getElementById('pStatus');
    const pRole = document.getElementById('pRole');
    const pVoucherUsed = document.getElementById('pVoucherUsed');
    const historyList = document.getElementById('historyList');
    const adminOrders = document.getElementById('adminOrders');
    const adminNap = document.getElementById('adminNap');
    const userList = document.getElementById('userList');
    const loginUser = document.getElementById('loginUser');
    const loginPass = document.getElementById('loginPass');
    const loginError = document.getElementById('loginError');
    const loginSuccess = document.getElementById('loginSuccess');
    const voucherStatus = document.getElementById('voucherStatus');
    const napCodeDisplay = document.getElementById('napCodeDisplay');
    const qrContainer = document.getElementById('qrContainer');
    const napCodeContainer = document.getElementById('napCodeContainer');

    // ======= BOTTOM NAV CLICK =======
    document.querySelectorAll('.bottom-nav button').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var page = this.getAttribute('data-page');
            // KIỂM TRA NẾU KHÔNG PHẢI ADMIN THÌ KHÔNG CHO VÀO TRANG ADMIN
            if (page === 'page-admin' && (!currentUser || currentUser.role !== 'admin')) {
                alert('⚠️ Bạn không có quyền truy cập trang Admin!');
                return;
            }
            switchPage(page);
        });
    });

    // ======= CHUYỂN TRANG =======
    function switchPage(pageId) {
        // Ẩn tất cả các trang
        document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
        
        // Hiện trang được chọn
        var target = document.getElementById(pageId);
        if (target) target.classList.add('active');
        
        // Cập nhật active cho bottom nav
        document.querySelectorAll('.bottom-nav button').forEach(function(b) { b.classList.remove('active'); });
        var navBtn = document.querySelector('.bottom-nav button[data-page="' + pageId + '"]');
        if (navBtn) navBtn.classList.add('active');
        
        // NẾU KHÔNG PHẢI TRANG ADMIN -> ẨN QUẢN LÝ ADMIN
        if (pageId !== 'page-admin') {
            document.querySelectorAll('.admin-only').forEach(function(el) { 
                el.classList.remove('show'); 
            });
        } else {
            // NẾU LÀ TRANG ADMIN VÀ ĐANG ĐĂNG NHẬP ADMIN -> HIỆN QUẢN LÝ ADMIN
            if (currentUser && currentUser.role === 'admin') {
                document.querySelectorAll('.admin-only').forEach(function(el) { 
                    el.classList.add('show'); 
                });
            }
        }
    }

    // ======= TẠO MÃ NẠP TIỀN =======
    function generateNapCode() {
        var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        var code = 'NAP-';
        for (var i = 0; i < 8; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
    }

    function refreshNapCode() {
        currentNapCode = generateNapCode();
        if (napCodeDisplay) napCodeDisplay.textContent = currentNapCode;
    }

    function copyNapCode() {
        if (!currentNapCode) { alert('⚠️ Chưa có mã nạp tiền!'); return; }
        var textarea = document.createElement('textarea');
        textarea.value = currentNapCode;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('✅ Đã sao chép mã: ' + currentNapCode);
    }

    // ======= HIỆN QR + MÃ NẠP =======
    function showNapInfo() {
        refreshNapCode();
        qrContainer.classList.add('show');
        napCodeContainer.classList.add('show');
    }

    // ======= ẨN QR + MÃ NẠP =======
    function hideNapInfo() {
        qrContainer.classList.remove('show');
        napCodeContainer.classList.remove('show');
    }

    // ======= RELOAD =======
    window.reloadAdmin = function() {
        users = JSON.parse(localStorage.getItem('users')) || [];
        if (!users.find(function(u) { return u.username === ADMIN_ACCOUNT.username })) {
            users.push(ADMIN_ACCOUNT);
            localStorage.setItem('users', JSON.stringify(users));
        }
        if (currentUser) {
            var updatedUser = users.find(function(u) { return u.username === currentUser.username });
            if (updatedUser) {
                currentUser.balance = updatedUser.balance || 0;
                currentUser.voucherUsed = updatedUser.voucherUsed || false;
            }
        }
        renderAdmin();
        updateUI();
        alert('✅ Đã tải lại dữ liệu mới nhất!');
    };

    // ======= RENDER USER =======
    function renderUserList() {
        var html = '';
        users.forEach(function(u) {
            var roleClass = u.role === 'admin' ? 'role-admin' : 'role-user';
            var roleText = u.role === 'admin' ? 'Admin' : 'User';
            var voucherText = u.voucherUsed ? 'Đã dùng' : 'Chưa dùng';
            html +=
                '<div class="user-item"><div class="user-row"><div><strong>' + u.username +
                '</strong></div><div><span class="user-balance">' + (u.balance || 0).toLocaleString() +
                'đ</span><span class="user-role ' + roleClass + '">' + roleText +
                '</span></div></div><div style="color:#88c8d8;font-size:12px;margin-top:4px;">Voucher: ' +
                voucherText + '</div>';
            if (u.role !== 'admin') {
                html +=
                    '<div class="user-actions"><input type="number" id="amount_' + u.username +
                    '" placeholder="Số tiền" style="width:80px;" /><button class="btn-add-money" onclick="adminAddMoney(\'' +
                    u.username + '\')">+ Thêm</button><button class="btn-sub-money" onclick="adminSubMoney(\'' +
                    u.username + '\')">- Trừ</button></div>';
            }
            html += '</div>';
        });
        userList.innerHTML = html;
    }

    // ======= ADMIN TIỀN =======
    window.adminAddMoney = function(username) {
        var input = document.getElementById('amount_' + username);
        var amount = parseInt(input.value);
        if (!amount || amount <= 0) { alert('⚠️ Vui lòng nhập số tiền hợp lệ!'); return; }
        users = JSON.parse(localStorage.getItem('users')) || [];
        var user = users.find(function(u) { return u.username === username });
        if (user) {
            user.balance = (user.balance || 0) + amount;
            localStorage.setItem('users', JSON.stringify(users));
            if (currentUser && currentUser.username === username) { currentUser.balance = user.balance; }
            alert('✅ Đã cộng ' + amount.toLocaleString() + 'đ vào tài khoản ' + username);
            input.value = '';
            renderAdmin();
            updateUI();
        }
    };

    window.adminSubMoney = function(username) {
        var input = document.getElementById('amount_' + username);
        var amount = parseInt(input.value);
        if (!amount || amount <= 0) { alert('⚠️ Vui lòng nhập số tiền hợp lệ!'); return; }
        users = JSON.parse(localStorage.getItem('users')) || [];
        var user = users.find(function(u) { return u.username === username });
        if (user) {
            if ((user.balance || 0) < amount) { alert('❌ Số dư không đủ để trừ!'); return; }
            user.balance = (user.balance || 0) - amount;
            localStorage.setItem('users', JSON.stringify(users));
            if (currentUser && currentUser.username === username) { currentUser.balance = user.balance; }
            alert('✅ Đã trừ ' + amount.toLocaleString() + 'đ của tài khoản ' + username);
            input.value = '';
            renderAdmin();
            updateUI();
        }
    };

    // ======= RENDER SẢN PHẨM =======
    function renderProducts(cat) {
        var filtered = products.filter(function(p) { return p.cat === cat });
        if (filtered.length === 0) {
            productList.innerHTML = '<p style="color:#88c8d8;text-align:center;padding:20px 0;">Không có sản phẩm nào.</p>';
            return;
        }
        var html = '';
        filtered.forEach(function(p) {
            html +=
                '<div class="product"><div class="info"><h3>' + p.name +
                '</h3><span class="tag">Sản phẩm kỹ thuật số</span></div><div class="price">' + p.price
                .toLocaleString() + 'đ</div><button class="btn-buy" data-id="' + p.id + '">MUA NGAY</button></div>';
        });
        productList.innerHTML = html;

        document.querySelectorAll('.btn-buy').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                var id = parseInt(this.getAttribute('data-id'));
                var product = products.find(function(p) { return p.id === id });
                if (!product) return;
                if (!currentUser) { alert('⚠️ Vui lòng đăng nhập trước khi mua!');
                    switchPage('page-profile'); return; }

                var finalPrice = product.price;
                var useVoucher = voucherApplied && !currentUser.voucherUsed;
                if (useVoucher) { finalPrice = Math.round(product.price * (1 - discountPercent / 100)); }

                if (currentUser.balance < finalPrice) {
                    alert('❌ Số dư không đủ! Cần ' + finalPrice.toLocaleString() + 'đ');
                    return;
                }

                currentUser.balance -= finalPrice;
                var userInList = users.find(function(u) { return u.username === currentUser.username });
                if (userInList) {
                    userInList.balance = currentUser.balance;
                    if (useVoucher) {
                        userInList.voucherUsed = true;
                        currentUser.voucherUsed = true;
                        voucherApplied = false;
                        updateVoucherStatus();
                    }
                    localStorage.setItem('users', JSON.stringify(users));
                }

                pendingOrders.push({
                    id: orderCounter++,
                    product: product.name,
                    price: finalPrice,
                    user: currentUser.username,
                    date: new Date().toLocaleString(),
                    status: 'pending',
                    key: null,
                    voucherUsed: useVoucher
                });

                history.push({
                    type: 'Mua key (chờ duyệt)',
                    product: product.name,
                    amount: -finalPrice,
                    date: new Date().toLocaleString(),
                    status: 'pending',
                    key: null,
                    voucherUsed: useVoucher,
                    discount: useVoucher ? '20%' : '0%'
                });

                updateUI();
                renderAdmin();
                alert('⏳ Đã tạo đơn mua: ' + product.name + '\nSố tiền: ' + finalPrice.toLocaleString() + 'đ' + (
                    useVoucher ? ' (đã giảm 20%)' : '') + '\nVui lòng chờ admin duyệt!');
            });
        });
    }

    // ======= UPDATE VOUCHER =======
    function updateVoucherStatus() {
        if (!currentUser) {
            voucherStatus.textContent = '💡 Nhập mã Admin_hi_51580 để giảm 20% (1 lần duy nhất)';
            voucherStatus.className = 'voucher-status';
            return;
        }
        if (currentUser.voucherUsed) {
            voucherStatus.textContent = '❌ Bạn đã sử dụng voucher rồi! Chỉ áp dụng 1 lần.';
            voucherStatus.className = 'voucher-status used';
        } else if (voucherApplied) {
            voucherStatus.textContent = '✅ Đã áp dụng voucher! Giảm 20% cho đơn hàng này.';
            voucherStatus.className = 'voucher-status active';
        } else {
            voucherStatus.textContent = '💡 Nhập mã Admin_hi_51580 để giảm 20% (1 lần duy nhất)';
            voucherStatus.className = 'voucher-status';
        }
    }

    // ======= RENDER ADMIN =======
    function renderAdmin() {
        // CHỈ RENDER DANH SÁCH USER KHI ĐANG Ở TRANG ADMIN
        if (currentUser && currentUser.role === 'admin') {
            renderUserList();
        } else {
            userList.innerHTML = '<p style="color:#88c8d8;">Vui lòng đăng nhập Admin để xem.</p>';
        }

        var pending = pendingOrders.filter(function(o) { return o.status === 'pending' });
        if (pending.length === 0) {
            adminOrders.innerHTML = '<p style="color:#88c8d8;">Chưa có đơn hàng chờ duyệt</p>';
        } else {
            var html = '';
            pending.forEach(function(o) {
                html +=
                    '<div class="order-item"><div><strong>' + o.product + '</strong> - ' + o.price
                    .toLocaleString() + 'đ ' + (o.voucherUsed ? '🎫 -20%' : '') +
                    '</div><div>👤 ' + o.user + '</div><div class="date">' + o.date +
                    '</div><div class="key-input"><input type="text" class="keyInput" placeholder="Nhập key" /><button class="btn-approve-order" data-id="' +
                    o.id + '">✅ Duyệt</button></div></div>';
            });
            adminOrders.innerHTML = html;

            document.querySelectorAll('.btn-approve-order').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var id = parseInt(this.getAttribute('data-id'));
                    var order = pendingOrders.find(function(o) { return o.id === id });
                    if (!order) return;
                    var keyInput = this.closest('.order-item').querySelector('.keyInput');
                    var key = keyInput.value.trim();
                    if (!key) { alert('⚠️ Vui lòng nhập key trước khi duyệt!'); return; }
                    order.status = 'delivered';
                    order.key = key;
                    for (var i = 0; i < history.length; i++) {
                        var h = history[i];
                        if (h.type === 'Mua key (chờ duyệt)' &&
                            h.product === order.product &&
                            h.amount === -order.price) {
                            h.status = 'delivered';
                            h.key = key;
                            break;
                        }
                    }
                    alert('✅ Đã duyệt đơn: ' + order.product + '\n🔑 Key: ' + key);
                    renderAdmin();
                    updateUI();
                });
            });
        }

        var pendingNapList = pendingNap.filter(function(n) { return n.status === 'pending' });
        if (pendingNapList.length === 0) {
            adminNap.innerHTML = '<p style="color:#88c8d8;">Chưa có yêu cầu nạp tiền</p>';
        } else {
            var html = '';
            pendingNapList.forEach(function(n) {
                html +=
                    '<div class="nap-item"><div><strong>' + n.amount.toLocaleString() +
                    'đ</strong></div><div>👤 ' + n.user + '</div><div style="color:#88c8d8;font-size:12px;">Mã: ' +
                    (n.code || 'Không có') + '</div><div class="date">' + n.date +
                    '</div><button class="btn-approve-nap" data-id="' + n.id + '">✅ Duyệt</button></div>';
            });
            adminNap.innerHTML = html;

            document.querySelectorAll('.btn-approve-nap').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var id = parseInt(this.getAttribute('data-id'));
                    var nap = pendingNap.find(function(n) { return n.id === id });
                    if (nap) {
                        nap.status = 'approved';
                        users = JSON.parse(localStorage.getItem('users')) || [];
                        var user = users.find(function(u) { return u.username === nap.user });
                        if (user) {
                            user.balance = (user.balance || 0) + nap.amount;
                            localStorage.setItem('users', JSON.stringify(users));
                            if (currentUser && currentUser.username === nap.user) {
                                currentUser.balance = user.balance;
                            }
                            history.push({
                                type: 'Nạp tiền (đã duyệt)',
                                product: '',
                                amount: nap.amount,
                                date: new Date().toLocaleString(),
                                status: 'approved'
                            });
                            alert('✅ Đã duyệt nạp ' + nap.amount.toLocaleString() + 'đ cho ' + nap.user);
                            renderAdmin();
                            updateUI();
                        } else { alert('❌ Không tìm thấy user: ' + nap.user); }
                    }
                });
            });
        }
    }

    // ======= UPDATE UI =======
    function updateUI() {
        if (currentUser) {
            userName.textContent = currentUser.username;
            userBalance.textContent = currentUser.balance.toLocaleString() + 'đ';
            pName.textContent = currentUser.username;
            pBalance.textContent = currentUser.balance.toLocaleString() + 'đ';
            pStatus.textContent = 'Đã đăng nhập';
            pRole.textContent = currentUser.role || 'User';
            pVoucherUsed.textContent = currentUser.voucherUsed ? '✅ Đã dùng' : '❌ Chưa dùng';
            
            // CHỈ HIỆN ADMIN KHI ĐANG ĐĂNG NHẬP ADMIN
            if (currentUser.role === 'admin') {
                document.querySelectorAll('.admin-only').forEach(function(el) { el.classList.add('show'); });
            } else {
                document.querySelectorAll('.admin-only').forEach(function(el) { el.classList.remove('show'); });
            }
        } else {
            userName.textContent = 'Khách';
            userBalance.textContent = '0đ';
            pName.textContent = 'Khách';
            pBalance.textContent = '0đ';
            pStatus.textContent = 'Chưa đăng nhập';
            pRole.textContent = 'Khách';
            pVoucherUsed.textContent = 'Chưa';
            document.querySelectorAll('.admin-only').forEach(function(el) { el.classList.remove('show'); });
            hideNapInfo();
        }
        renderHistory();
        updateVoucherStatus();
    }

    // ======= RENDER LỊCH SỬ =======
    function renderHistory() {
        if (!currentUser || history.length === 0) {
            historyList.innerHTML = '<p style="color:#88c8d8;">Vui lòng đăng nhập để xem lịch sử.</p>';
            return;
        }
        var html = '';
        var reversedHistory = history.slice().reverse();
        for (var i = 0; i < reversedHistory.length; i++) {
            var item = reversedHistory[i];
            var sign = item.amount >= 0 ? '+' : '';
            var statusBadge = '';
            var keyDisplay = '';
            var discountDisplay = item.discount && item.discount !== '0%' ? '🎫 ' + item.discount : '';

            if (item.status === 'pending') {
                statusBadge = '<span class="status-badge status-pending">⏳ Chờ duyệt</span>';
            } else if (item.status === 'delivered') {
                statusBadge = '<span class="status-badge status-delivered">✅ Đã giao</span>';
                if (item.key) {
                    keyDisplay = '<div class="key-display">🔑 Key: ' + item.key + '</div>';
                }
            } else if (item.status === 'approved') {
                statusBadge = '<span class="status-badge status-approved">✅ Đã duyệt</span>';
            }

            html +=
                '<div class="history-item"><div><strong>' + item.type + '</strong> - ' + (item.product || '') +
                ' ' + discountDisplay + ' ' + statusBadge + '</div><div style="color:' + (item.amount >= 0 ?
                    '#4caf50' : '#ff6a00') + ';">' + sign + item.amount.toLocaleString() +
                'đ</div><div class="date">' + item.date + '</div>' + keyDisplay + '</div>';
        }
        historyList.innerHTML = html;
    }

    // ======= ĐĂNG NHẬP =======
    document.getElementById('btnLogin').addEventListener('click', function() {
        var username = loginUser.value.trim();
        var password = loginPass.value.trim();
        loginError.style.display = 'none';
        loginSuccess.style.display = 'none';
        if (!username || !password) {
            loginError.textContent = '⚠️ Vui lòng nhập đầy đủ tên và mật khẩu!';
            loginError.style.display = 'block';
            return;
        }
        users = JSON.parse(localStorage.getItem('users')) || [];
        var user = users.find(function(u) { return u.username === username && u.password === password });
        if (!user) {
            loginError.textContent = '❌ Sai tên đăng nhập hoặc mật khẩu!';
            loginError.style.display = 'block';
            return;
        }
        currentUser = {
            username: user.username,
            password: user.password,
            role: user.role || 'user',
            balance: user.balance || 0,
            voucherUsed: user.voucherUsed || false
        };
        loginUser.value = '';
        loginPass.value = '';
        loginSuccess.textContent = '✅ Chào mừng ' + currentUser.username + '!';
        loginSuccess.style.display = 'block';
        updateUI();
        renderProducts(currentCategory);
        renderAdmin();
        refreshNapCode();
        hideNapInfo();
        alert('✅ Chào mừng ' + currentUser.username + '!' + (currentUser.role === 'admin' ? ' (Admin)' : ''));
        switchPage('page-home');
    });

    // ======= ĐĂNG KÝ =======
    document.getElementById('btnRegister').addEventListener('click', function() {
        var username = loginUser.value.trim();
        var password = loginPass.value.trim();
        loginError.style.display = 'none';
        loginSuccess.style.display = 'none';
        if (!username || !password) {
            loginError.textContent = '⚠️ Vui lòng nhập đầy đủ tên và mật khẩu!';
            loginError.style.display = 'block';
            return;
        }
        if (username.length < 3) {
            loginError.textContent = '⚠️ Tên đăng nhập phải có ít nhất 3 ký tự!';
            loginError.style.display = 'block';
            return;
        }
        if (password.length < 4) {
            loginError.textContent = '⚠️ Mật khẩu phải có ít nhất 4 ký tự!';
            loginError.style.display = 'block';
            return;
        }
        users = JSON.parse(localStorage.getItem('users')) || [];
        if (users.find(function(u) { return u.username === username })) {
            loginError.textContent = '❌ Tên đăng nhập đã tồn tại!';
            loginError.style.display = 'block';
            return;
        }
        users.push({ username: username, password: password, role: 'user', balance: 0, voucherUsed: false });
        localStorage.setItem('users', JSON.stringify(users));
        loginSuccess.textContent = '✅ Đăng ký thành công! Vui lòng đăng nhập.';
        loginSuccess.style.display = 'block';
        loginUser.value = '';
        loginPass.value = '';
        if (currentUser && currentUser.role === 'admin') { renderAdmin(); }
    });

    // ======= ĐĂNG XUẤT =======
    document.getElementById('btnLogout').addEventListener('click', function() {
        if (!currentUser) { alert('Bạn chưa đăng nhập!'); return; }
        if (confirm('Bạn muốn đăng xuất?')) {
            currentUser = null;
            history = [];
            voucherApplied = false;
            hideNapInfo();
            document.querySelectorAll('.admin-only').forEach(function(el) { el.classList.remove('show'); });
            updateUI();
            renderProducts(currentCategory);
            switchPage('page-home');
        }
    });

    // ======= VOUCHER =======
    document.getElementById('btnApplyVoucher').addEventListener('click', function() {
        if (!currentUser) { alert('⚠️ Vui lòng đăng nhập trước!'); return; }
        if (currentUser.voucherUsed) { alert('❌ Bạn đã sử dụng voucher rồi! Chỉ áp dụng 1 lần.'); return; }
        var code = document.getElementById('voucherInput').value.trim();
        if (code === 'Admin_hi_51580') {
            voucherApplied = true;
            updateVoucherStatus();
            alert('✅ Đã áp dụng mã giảm giá 20%!');
            document.getElementById('voucherInput').value = '';
        } else { alert('❌ Mã giảm giá không hợp lệ!'); }
    });

    document.getElementById('voucherInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { document.getElementById('btnApplyVoucher').click(); }
    });

    // ===== NẠP TIỀN =====
    document.getElementById('btnNap').addEventListener('click', function() {
        if (!currentUser) {
            alert('⚠️ Vui lòng đăng nhập để nạp tiền!');
            return;
        }
        var amount = parseInt(document.getElementById('napAmount').value);
        if (!amount || amount <= 0) {
            alert('❌ Vui lòng nhập số tiền hợp lệ!');
            return;
        }

        showNapInfo();

        var napReq = {
            id: napCounter++,
            amount: amount,
            user: currentUser.username,
            date: new Date().toLocaleString(),
            status: 'pending',
            code: currentNapCode
        };
        pendingNap.push(napReq);

        history.push({
            type: 'Nạp tiền (chờ duyệt)',
            product: '',
            amount: amount,
            date: new Date().toLocaleString(),
            status: 'pending'
        });

        updateUI();
        renderAdmin();
        document.getElementById('napAmount').value = '';
        alert('⏳ Đã tạo yêu cầu nạp ' + amount.toLocaleString() + 'đ\n📌 Mã nạp: ' + napReq.code +
            '\nVui lòng chờ admin duyệt!');
    });

    // ======= LỌC DANH MỤC =======
    categoryFilter.addEventListener('click', function(e) {
        if (e.target.tagName === 'BUTTON') {
            document.querySelectorAll('.category-grid button').forEach(function(b) { b.classList.remove('active'); });
            e.target.classList.add('active');
            currentCategory = e.target.getAttribute('data-cat');
            renderProducts(currentCategory);
        }
    });

    // ======= KHỞI CHẠY =======
    renderProducts('aim');
    updateUI();
    renderAdmin();
    refreshNapCode();
    hideNapInfo();
        </script>
