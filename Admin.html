<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN HI STORE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

h1, h2 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-weight: bold;
    margin: 3px;
}

.btn {
    background: #2563eb;
    color: white;
}

.green {
    background: #16a34a;
    color: white;
}

.red {
    background: #dc2626;
    color: white;
}

.gray {
    background: #6b7280;
    color: white;
}

.hidden {
    display: none !important;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.stat {
    background: #111827;
    color: white;
    border-radius: 12px;
    padding: 18px;
}

.stat b {
    display: block;
    font-size: 28px;
    margin-top: 8px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th, td {
    border-bottom: 1px solid #e5e7eb;
    padding: 12px 8px;
    text-align: left;
}

th {
    background: #f9fafb;
}

.badge {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.pending {
    background: #fef3c7;
    color: #92400e;
}

.approved {
    background: #dcfce7;
    color: #166534;
}

.rejected {
    background: #fee2e2;
    color: #991b1b;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

#message {
    margin: 10px 0;
    font-weight: bold;
}

@media(max-width:700px) {
    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div id="loginPage" class="card">

        <h1>🔐 ADMIN HI STORE</h1>

        <p>Đăng nhập khu vực quản trị</p>

        <input
            id="username"
            type="text"
            placeholder="Tên Admin"
        >

        <input
            id="password"
            type="password"
            placeholder="Mật khẩu"
        >

        <button class="btn" onclick="login()">
            Đăng nhập Admin
        </button>

        <div id="loginMessage"></div>

    </div>


    <!-- ADMIN -->
    <div id="adminPage" class="hidden">

        <div class="card top">

            <div>
                <h1>🛠️ ADMIN HI STORE</h1>
                <span id="adminName"></span>
            </div>

            <button class="red" onclick="logout()">
                Đăng xuất
            </button>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat">
                👥 Tổng User
                <b id="totalUsers">0</b>
            </div>

            <div class="stat">
                💰 Chờ nạp
                <b id="pendingDeposits">0</b>
            </div>

            <div class="stat">
                🛒 Đơn hàng
                <b id="totalOrders">0</b>
            </div>

        </div>

        <br>


        <!-- MESSAGE -->

        <div id="message"></div>


        <!-- USERS -->

        <div class="card">

            <div class="top">
                <h2>👥 Danh sách tài khoản</h2>

                <button class="btn" onclick="loadAll()">
                    🔄 Làm mới
                </button>
            </div>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tài khoản</th>
                            <th>Số dư</th>
                            <th>Tổng nạp</th>
                            <th>Đã tiêu</th>
                            <th>Quyền</th>
                            <th>Chỉnh tiền</th>
                        </tr>
                    </thead>

                    <tbody id="usersTable"></tbody>

                </table>

            </div>

        </div>


        <!-- DEPOSITS -->

        <div class="card">

            <h2>💰 Yêu cầu nạp tiền</h2>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>Số tiền</th>
                            <th>Trạng thái</th>
                            <th>Thời gian</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>

                    <tbody id="depositsTable"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

let token = localStorage.getItem("admin_token") || "";


// ============================
// API
// ============================

async function api(url, options = {}) {

    options.headers = {
        ...(options.headers || {}),
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
    };

    const response = await fetch(url, options);

    let data;

    try {
        data = await response.json();
    } catch {
        data = {};
    }

    if (!response.ok) {
        throw new Error(
            data.message || "Có lỗi xảy ra."
        );
    }

    return data;
}


// ============================
// LOGIN
// ============================

async function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const msg =
        document.getElementById("loginMessage");

    msg.textContent = "";

    if (!username || !password) {
        msg.textContent = "⚠️ Nhập đầy đủ tài khoản và mật khẩu.";
        return;
    }

    try {

        const response = await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username,
                password
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || "Đăng nhập thất bại."
            );
        }

        if (data.role !== "admin") {

            msg.textContent =
                "❌ Tài khoản này không có quyền Admin.";

            return;
        }

        token = data.token;

        localStorage.setItem(
            "admin_token",
            token
        );

        localStorage.setItem(
            "admin_username",
            data.username
        );

        showAdmin();

    } catch (error) {

        msg.textContent =
            "❌ " + error.message;
    }
}


// ============================
// SHOW ADMIN
// ============================

async function showAdmin() {

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("adminPage")
        .classList.remove("hidden");

    document
        .getElementById("adminName")
        .textContent =
        "Đang đăng nhập: " +
        (localStorage.getItem("admin_username") || "");

    await loadAll();
}


// ============================
// LOAD EVERYTHING
// ============================

async function loadAll() {

    try {

        await Promise.all([
            loadStats(),
            loadUsers(),
            loadDeposits()
        ]);

    } catch (error) {

        showMessage(
            "❌ " + error.message,
            true
        );

        if (
            error.message.includes("đăng nhập") ||
            error.message.includes("Admin")
        ) {
            logout();
        }
    }
}


// ============================
// STATS
// ============================

async function loadStats() {

    const data =
        await api("/api/admin/stats");

    document
        .getElementById("totalUsers")
        .textContent = data.users;

    document
        .getElementById("pendingDeposits")
        .textContent = data.deposits;

    document
        .getElementById("totalOrders")
        .textContent = data.orders;
}


// ============================
// USERS
// ============================

async function loadUsers() {

    const users =
        await api("/api/admin/users");

    const tbody =
        document.getElementById("usersTable");

    tbody.innerHTML = "";

    if (!users.length) {

        tbody.innerHTML =
            `<tr>
                <td colspan="7">
                    Chưa có tài khoản.
                </td>
            </tr>`;

        return;
    }

    users.forEach(user => {

        const tr =
            document.createElement("tr");

        tr.innerHTML = `

            <td>${user.id}</td>

            <td>
                <b>${escapeHtml(user.username)}</b>
            </td>

            <td>
                <b>
                    ${formatMoney(user.balance)}
                </b>
            </td>

            <td>
                ${formatMoney(user.total_deposit)}
            </td>

            <td>
                ${formatMoney(user.total_spent)}
            </td>

            <td>
                ${
                    user.is_admin
                    ? '<span class="badge approved">ADMIN</span>'
                    : '<span class="badge">USER</span>'
                }
            </td>

            <td>

                <button
                    class="green"
                    onclick="changeBalance(${user.id}, 1)"
                >
                    + Tiền
                </button>

                <button
                    class="red"
                    onclick="changeBalance(${user.id}, -1)"
                >
                    - Tiền
                </button>

            </td>

        `;

        tbody.appendChild(tr);

    });
}


// ============================
// DEPOSITS
// ============================

async function loadDeposits() {

    const deposits =
        await api("/api/admin/deposits");

    const tbody =
        document.getElementById("depositsTable");

    tbody.innerHTML = "";

    if (!deposits.length) {

        tbody.innerHTML =
            `<tr>
                <td colspan="6">
                    Chưa có yêu cầu nạp.
                </td>
            </tr>`;

        return;
    }

    deposits.forEach(item => {

        let statusClass =
            item.status === "approved"
            ? "approved"
            : item.status === "rejected"
            ? "rejected"
            : "pending";

        let statusText =
            item.status === "approved"
            ? "Đã duyệt"
            : item.status === "rejected"
            ? "Đã từ chối"
            : "Đang chờ";

        let action = "";

        if (item.status === "pending") {

            action = `

                <button
                    class="green"
                    onclick="approveDeposit(${item.id})"
                >
                    ✓ Duyệt
                </button>

                <button
                    class="red"
                    onclick="rejectDeposit(${item.id})"
                >
                    ✕ Từ chối
                </button>

            `;
        }

        const tr =
            document.createElement("tr");

        tr.innerHTML = `

            <td>${item.id}</td>

            <td>
                ${escapeHtml(item.username)}
            </td>

            <td>
                <b>
                    ${formatMoney(item.amount)}
                </b>
            </td>

            <td>
                <span class="badge ${statusClass}">
                    ${statusText}
                </span>
            </td>

            <td>
                ${new Date(item.created_at).toLocaleString("vi-VN")}
            </td>

            <td>
                ${action}
            </td>

        `;

        tbody.appendChild(tr);

    });
}


// ============================
// APPROVE
// ============================

async function approveDeposit(id) {

    if (!confirm(
        "Bạn chắc chắn muốn DUYỆT yêu cầu nạp này?"
    )) {
        return;
    }

    try {

        await api(
            `/api/admin/deposits/${id}/approve`,
            {
                method: "POST"
            }
        );

        showMessage(
            "✅ Đã duyệt nạp tiền."
        );

        await loadAll();

    } catch (error) {

        showMessage(
            "❌ " + error.message,
            true
        );
    }
}


// ============================
// REJECT
// ============================

async function rejectDeposit(id) {

    if (!confirm(
        "Bạn chắc chắn muốn TỪ CHỐI yêu cầu này?"
    )) {
        return;
    }

    try {

        await api(
            `/api/admin/deposits/${id}/reject`,
            {
                method: "POST"
            }
        );

        showMessage(
            "✅ Đã từ chối yêu cầu."
        );

        await loadAll();

    } catch (error) {

        showMessage(
            "❌ " + error.message,
            true
        );
    }
}


// ============================
// CHANGE BALANCE
// ============================

async function changeBalance(userId, direction) {

    const text =
        direction === 1
        ? "Nhập số tiền muốn CỘNG:"
        : "Nhập số tiền muốn TRỪ:";

    const input =
        prompt(text);

    if (input === null) {
        return;
    }

    const amount =
        Number(input);

    if (!Number.isFinite(amount) || amount <= 0) {

        alert("Số tiền không hợp lệ.");

        return;
    }

    const finalAmount =
        Math.floor(amount) * direction;

    if (!confirm(
        `Xác nhận ${
            direction === 1 ? "cộng" : "trừ"
        } ${formatMoney(Math.abs(finalAmount))}?`
    )) {
        return;
    }

    try {

        await api(
            `/api/admin/users/${userId}/balance`,
            {
                method: "POST",

                body: JSON.stringify({
                    amount: finalAmount
                })
            }
        );

        showMessage(
            "✅ Đã cập nhật số dư."
        );

        await loadAll();

    } catch (error) {

        showMessage(
            "❌ " + error.message,
            true
        );
    }
}


// ============================
// LOGOUT
// ============================

async function logout() {

    try {

        if (token) {

            await fetch(
                "/api/logout",
                {
                    method: "POST",
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );
        }

    } catch {}

    token = "";

    localStorage.removeItem(
        "admin_token"
    );

    localStorage.removeItem(
        "admin_username"
    );

    location.reload();
}


// ============================
// HELPERS
// ============================

function formatMoney(value) {

    return Number(value || 0)
        .toLocaleString("vi-VN") + "đ";
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function showMessage(text, error = false) {

    const el =
        document.getElementById("message");

    el.textContent = text;

    el.style.color =
        error ? "#dc2626" : "#16a34a";

    setTimeout(() => {
        el.textContent = "";
    }, 4000);
}


// ============================
// AUTO LOGIN
// ============================

if (token) {

    showAdmin().catch(() => {
        logout();
    });

}

</script>

</body>
  </html>
